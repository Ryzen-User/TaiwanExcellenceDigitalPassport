<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taiwan Excellence · Back to School Fair</title>
    <style>
        /* ─── (all styles unchanged – copy from the previous version) ─── */
        /* To keep the response concise, I'll use the same CSS as before. */
        /* Please use the CSS from the last working version. */
    </style>
</head>
<body>
    <!-- ─── (same HTML structure – unchanged) ─── -->
    <!-- Copy your existing HTML here -->

    <script>
        /* ──────────────────────────────────────────────────────────────
           CONFIGURATION – Web App URL
           ────────────────────────────────────────────────────────────── */
        const GOOGLE_SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzG7zJ7pg0jDF33SEruE1g0_yLew4RMRlYBuH4-_aPkFT2ot3TybUyTlcF6S7LhrXH0/exec';
        const STORAGE_KEY = 'te_passport_data';
        const PARTICIPANT_STORAGE_KEY = 'te_participant';
        const ADMIN_STORAGE_KEY = 'te_admin_session';

        // ─── all constants (IMAGE_PATHS, BOOTHS, ADMIN_ROLES) unchanged ───

        let currentParticipant = '';
        let adminLoggedIn = false;
        let adminRole = null;
        let allowedBooths = [];
        let autoSyncInterval = null;

        /* ─── DATA LAYER ─── (same as before) ─── */

        /* ─── FETCH HELPERS with detailed logging ─── */
        async function callWebAppGet(params) {
            const url = new URL(GOOGLE_SHEET_WEBAPP_URL);
            Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
            console.log('📤 GET request to:', url.toString());
            const response = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit' });
            const text = await response.text();
            console.log('📥 Raw response:', text);
            let data;
            try { data = JSON.parse(text); } catch (e) {
                throw new Error(`Server returned invalid JSON: ${text.substring(0, 200)}`);
            }
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            return data;
        }

        async function callWebAppPost(body) {
            const formBody = new URLSearchParams(body);
            console.log('📤 POST request to:', GOOGLE_SHEET_WEBAPP_URL);
            const response = await fetch(GOOGLE_SHEET_WEBAPP_URL, {
                method: 'POST', mode: 'cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formBody, credentials: 'omit'
            });
            const text = await response.text();
            console.log('📥 Raw response:', text);
            let data;
            try { data = JSON.parse(text); } catch (e) {
                throw new Error(`Server returned invalid JSON: ${text.substring(0, 200)}`);
            }
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            return data;
        }

        /* ─── SYNC FUNCTIONS with better error handling ─── */
        async function syncParticipantFromSheet(name) {
            setSyncStatus('syncing');
            try {
                const result = await callWebAppGet({ action: 'getParticipant', name: name });
                console.log('Sync result:', result);
                if (result.success && result.participant) {
                    const data = loadData();
                    const p = getParticipantData(data, name);
                    if (p) {
                        BOOTH_KEYS.forEach(k => {
                            if (result.participant.booths && result.participant.booths[k] !== undefined) {
                                p.booths[k] = result.participant.booths[k];
                            }
                        });
                        p.raffleSubmitted = result.participant.raffleSubmitted || false;
                        if (result.participant.formData) p.formData = result.participant.formData;
                        saveData(data);
                        setSyncStatus('synced');
                        return true;
                    }
                }
                setSyncStatus('error');
                console.warn('Sync failed – invalid response:', result);
                return false;
            } catch (error) {
                console.error('Sync error:', error);
                setSyncStatus('error');
                showToast('Sync failed: ' + error.message, 'error');
                return false;
            }
        }

        // ─── (all other functions unchanged) ───

        /* ─── OVERRIDE testConnection for debugging ─── */
        async function testConnection() {
            if (currentParticipant) {
                showToast('Refreshing your passport…', 'info');
                const synced = await syncParticipantFromSheet(currentParticipant);
                renderPassport(currentParticipant);
                if (synced) showToast('✅ Passport updated!', 'success');
                else showToast('❌ Sync failed – check console.', 'error');
            } else {
                showToast('Testing connection…', 'info');
                try {
                    const result = await callWebAppGet({ action: 'getAllParticipants' });
                    if (result.success) {
                        showToast('✅ Connection successful! Synced ' + (result.participants ? result.participants.length : 0) + ' participants.', 'success');
                    } else {
                        showToast('❌ Connection failed: ' + (result.error || 'unknown error'), 'error');
                    }
                } catch (e) {
                    showToast('❌ Connection error: ' + e.message, 'error');
                }
            }
        }

        // ─── toggleApproval (fixed) ─────────────────────────────────
        async function toggleApproval(participantName, boothKey, checked) {
            if (!allowedBooths.includes(boothKey)) {
                showToast('You do not have permission to approve this booth.', 'error');
                return;
            }
            const data = loadData();
            const success = setBoothApproval(data, participantName, boothKey, checked);
            if (success) {
                const label = BOOTHS.find(b => b.id === boothKey)?.label || boothKey;
                showToast(`${checked ? '✅ Approved' : '⏳ Revoked'} "${label}" for ${participantName}`, checked ? 'success' : '');

                // Push approval to sheet
                try {
                    const pushResult = await callWebAppPost({
                        action: 'updateApprovals',
                        name: participantName,
                        boothKey: boothKey,
                        approved: checked ? 'true' : 'false'
                    });
                    if (!pushResult.success) throw new Error(pushResult.error || 'Push failed');
                } catch (e) {
                    showToast('Failed to push approval: ' + e.message, 'error');
                    return;
                }

                // Sync the participant's data from the sheet
                const synced = await syncParticipantFromSheet(participantName);

                // If this is the current participant, re‑render their passport
                if (currentParticipant && currentParticipant === participantName) {
                    renderPassport(participantName);
                    if (synced) showToast('✅ Passport updated!', 'success');
                }

                // Refresh admin table
                renderAdminTable();
            } else {
                showToast('Error updating approval.', 'error');
            }
        }

        // ─── (rest of the script unchanged) ───

        console.log('✅ Taiwan Excellence Passport with debug logs loaded.');
        console.log('📌 Web App URL:', GOOGLE_SHEET_WEBAPP_URL);
        console.log('📌 Open the browser console (F12) to see detailed sync logs.');
    </script>
</body>
</html>
